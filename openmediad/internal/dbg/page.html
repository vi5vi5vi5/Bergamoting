<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omd — отладка колонки</title>
<style>
  /* Страница самодостаточна: ни внешних скриптов, ни шрифтов. Её можно сохранить как файл и открыть локально
     (тогда в поле «Колонка» укажите адрес и запустите шим с -debug-cors). */
  :root {
    --bg:#101418; --panel:#171d23; --line:#27303a; --text:#d8dee6; --dim:#8a96a3;
    --info:#6cb6ff; --warn:#e3b341; --error:#ff7b72; --trace:#5b6670; --ok:#56d364;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --line:#d0d7de; --text:#1f2328; --dim:#656d76; --info:#0969da; --warn:#9a6700; --error:#cf222e; --trace:#8c959f; --ok:#1a7f37; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 16px; }
  h1 { margin:0 12px 0 0; font-size:16px; display:inline-block; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .bar label { color:var(--dim); font-size:13px; white-space:nowrap; }
  input[type=text], select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 10px; cursor:pointer; }
  button:hover { border-color:var(--info); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--error); margin-right:5px; }
  .dot.ok { background:var(--ok); }
  #state { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; padding:10px 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13px; }
  .card b { display:block; margin-bottom:3px; font-size:12px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .card div { word-break:break-all; }
  #log { padding:0 16px 40px; }
  .row { display:grid; grid-template-columns:96px 92px 1fr; gap:0 10px; padding:3px 0; border-bottom:1px solid var(--line); }
  .row.trace .msg { color:var(--trace); }
  .row.warn .msg { color:var(--warn); } .row.error .msg { color:var(--error); }
  .t { color:var(--dim); font:12px ui-monospace,Consolas,monospace; padding-top:2px; }
  .src { font-size:12px; padding-top:2px; }
  .src span { display:inline-block; min-width:84px; text-align:center; border-radius:10px; padding:0 6px; color:#fff; font-size:11px; }
  .msg { cursor:pointer; }
  .why { color:var(--dim); font-size:12.5px; margin-top:1px; }
  .data { display:none; margin:3px 0 2px; padding:6px 8px; background:var(--panel); border:1px solid var(--line); border-radius:4px; font:12px ui-monospace,Consolas,monospace; white-space:pre-wrap; }
  .row.open .data { display:block; }
  .hide-why .why { display:none; }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
  @media (max-width:640px) { .row { grid-template-columns:70px 1fr; } .src { grid-column:2; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>omd — отладка колонки</h1>
    <span><span class="dot" id="dot"></span><span id="conn">нет связи</span></span>
    <label>Колонка <input type="text" id="host" size="22" placeholder="192.168.1.12:6701"></label>
    <label>Показывать
      <select id="lvl">
        <option value="all">всё, включая фон</option>
        <option value="main" selected>без фона</option>
        <option value="warn">только предупреждения и ошибки</option>
      </select></label>
    <label>Поиск <input type="text" id="q" size="16" placeholder="текст"></label>
    <label><input type="checkbox" id="why" checked> пояснения</label>
    <label><input type="checkbox" id="follow" checked> следить за концом</label>
    <button id="pause">Пауза</button>
    <button id="clear">Очистить</button>
    <a id="dl" href="#" style="color:var(--info)">скачать журнал</a>
    <span id="srcs" class="bar" style="gap:6px"></span>
    <span id="count" style="color:var(--dim);font-size:12px"></span>
  </div>
</header>
<section id="state"></section>
<main id="log"><div class="empty" id="empty">Ждём записи…</div></main>
<script>
"use strict";
// Цвет значка по источнику; незнакомые источники получают цвет по хешу имени.
const COLORS = { shim:"#8957e5", audioclient:"#1f6feb", player:"#2da44e", music:"#bf8700", aliced:"#d1242f", system:"#6e7781" };
const SRC_NAMES = { shim:"шим", audioclient:"шина плеера", player:"автомат плеера", music:"звук", aliced:"Алиса", system:"система" };
const MAX_ROWS = 3000;

const $ = id => document.getElementById(id);
const saved = (() => { try { return JSON.parse(localStorage.getItem("omd-dbg") || "{}"); } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem("omd-dbg", JSON.stringify({ host: $("host").value })); } catch (e) {} };

// Страница, открытая с колонки, ходит на тот же адрес; локальный файл — на адрес из поля.
const local = location.protocol === "file:" || !location.host;
$("host").value = new URLSearchParams(location.search).get("host") || saved.host || (local ? "192.168.1.12:6701" : location.host);
const base = () => { const h = $("host").value.trim(); return h ? "http://" + h.replace(/^https?:\/\//, "") : ""; };

let entries = [];          // всё полученное (не больше MAX_ROWS)
let hidden = new Set();    // отключённые источники
let paused = false, lastID = 0, es = null, seenSrc = new Set();

function colorOf(src) {
  if (COLORS[src]) return COLORS[src];
  let h = 0; for (const c of src) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 50% 42%)`;
}
function fmtTime(ms) {
  const d = new Date(ms), p = (n, w = 2) => String(n).padStart(w, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
}
function visible(e) {
  if (hidden.has(e.src)) return false;
  const lvl = $("lvl").value;
  if (lvl === "main" && e.lvl === "trace") return false;
  if (lvl === "warn" && e.lvl !== "warn" && e.lvl !== "error") return false;
  const q = $("q").value.trim().toLowerCase();
  if (q && !(e.msg + " " + (e.why || "") + " " + JSON.stringify(e.data || {})).toLowerCase().includes(q)) return false;
  return true;
}
function rowEl(e) {
  const r = document.createElement("div");
  r.className = "row " + e.lvl;
  const dataTxt = e.data ? JSON.stringify(e.data, null, 2) : "";
  r.innerHTML = `<div class="t"></div><div class="src"><span></span></div><div><div class="msg"></div><div class="why"></div><div class="data"></div></div>`;
  r.querySelector(".t").textContent = fmtTime(e.t);
  const b = r.querySelector(".src span"); b.textContent = SRC_NAMES[e.src] || e.src; b.style.background = colorOf(e.src);
  r.querySelector(".msg").textContent = e.msg;
  r.querySelector(".why").textContent = e.why || "";
  r.querySelector(".data").textContent = dataTxt;
  if (dataTxt) r.querySelector(".msg").title = "Нажмите, чтобы показать детали";
  r.querySelector(".msg").onclick = () => r.classList.toggle("open");
  return r;
}
function render() {
  const box = $("log"); box.textContent = "";
  const vis = entries.filter(visible);
  if (!vis.length) { box.innerHTML = '<div class="empty">Нет записей под выбранные фильтры</div>'; }
  const frag = document.createDocumentFragment();
  for (const e of vis.slice(-MAX_ROWS)) frag.appendChild(rowEl(e));
  box.appendChild(frag);
  $("count").textContent = `показано ${vis.length} из ${entries.length}`;
  if ($("follow").checked) window.scrollTo(0, document.body.scrollHeight);
}
function add(e) {
  entries.push(e); lastID = Math.max(lastID, e.id);
  if (entries.length > MAX_ROWS) entries.splice(0, entries.length - MAX_ROWS);
  if (!seenSrc.has(e.src)) { seenSrc.add(e.src); drawSources(); }
  if (paused) return;
  if (visible(e)) {
    const box = $("log"); const emp = box.querySelector(".empty"); if (emp) emp.remove();
    box.appendChild(rowEl(e));
    while (box.children.length > MAX_ROWS) box.removeChild(box.firstChild);
    if ($("follow").checked) window.scrollTo(0, document.body.scrollHeight);
  }
}
function drawSources() {
  const box = $("srcs"); box.textContent = "";
  for (const s of [...seenSrc].sort()) {
    const l = document.createElement("label");
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = !hidden.has(s);
    c.onchange = () => { c.checked ? hidden.delete(s) : hidden.add(s); render(); };
    l.appendChild(c); l.append(" " + (SRC_NAMES[s] || s)); box.appendChild(l);
  }
}

function connect() {
  if (es) es.close();
  const b = base();
  es = new EventSource(`${b}/api/stream?since=${lastID}`);
  es.onopen = () => { $("dot").className = "dot ok"; $("conn").textContent = "на связи"; };
  es.onerror = () => { $("dot").className = "dot"; $("conn").textContent = "нет связи, пробую снова…"; };
  es.onmessage = m => { try { add(JSON.parse(m.data)); } catch (e) {} };
  $("dl").href = `${b}/api/log?format=ndjson`;
}

// Карточки состояния: плоский разбор снимка /api/state.
function card(title, obj) {
  const c = document.createElement("div"); c.className = "card";
  const h = document.createElement("b"); h.textContent = title; c.appendChild(h);
  for (const [k, v] of Object.entries(obj)) {
    const d = document.createElement("div");
    d.textContent = `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`; c.appendChild(d);
  }
  return c;
}
async function poll() {
  try {
    const s = await (await fetch(`${base()}/api/state`, { cache: "no-store" })).json();
    const box = $("state"); box.textContent = "";
    box.appendChild(card("Процесс шима", { "работает, с": s.uptime_s, "память Go, КБ": s.heap_kb, "горутин": s.goroutines, "страниц открыто": s.viewers }));
    if (s.shim) {
      const sh = s.shim;
      if (sh.mode) box.appendChild(card("Режим", sh.mode));
      if (sh.players) box.appendChild(card(`Плееры шима (${sh.players.length})`, Object.fromEntries(sh.players.map(p => [p.id, `${p.state}${p.title ? " · " + p.title : ""}${p.pos_ms != null ? " · " + (p.pos_ms / 1000).toFixed(1) + " с" : ""}`]))));
      if (sh.engine) box.appendChild(card("Звуковой движок", sh.engine));
      if (sh.connections != null) box.appendChild(card("Соединения клиентов", { "открыто": sh.connections }));
    }
    box.appendChild(card("Записей по источникам", s.log_counts || {}));
  } catch (e) { /* связь пропала — индикатор уже покажет */ }
}

$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Продолжить" : "Пауза"; if (!paused) render(); };
$("clear").onclick = () => { entries = []; render(); };
for (const id of ["lvl", "q"]) $(id).oninput = render;
$("why").onchange = () => document.body.classList.toggle("hide-why", !$("why").checked);
$("host").onchange = () => { save(); lastID = 0; entries = []; render(); connect(); poll(); };

connect(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
